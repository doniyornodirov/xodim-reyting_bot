name: Build Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Print Failure Log
        if: failure()
        run: |
          echo "=== BUILD LOG FAILURE (LAST 100 LINES) ==="
          tail -n 100 build.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-failure-log
          path: build.log

      - name: Prepare APK for Release
        run: |
          mkdir -p static/downloads
          cp android/app/build/outputs/apk/debug/app-debug.apk static/downloads/xodim-reyting.apk
          echo "APK successfully built: $(ls -lh static/downloads/xodim-reyting.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xodim-reyting-apk
          path: static/downloads/xodim-reyting.apk
          retention-days: 30

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Xodim-Reyting CRM Android APK"
          body: |
            ## 📱 Xodim-Reyting CRM — Android Mobil Ilova (.apk)

            Ushbu mobil ilova xodimlarning ish joyi geolokatsiyasini doimiy, avtomatik va tezkor xotiradan (RAM) o'chirilganda ham uzluksiz monitoring qilish imkonini beradi.

            ### 🚀 Asosiy Imkoniyatlar:
            - **To'liq CRM tizimi**: Barcha amallar, kartalar, qarzlar, kassa, reyting va hisobotlar;
            - **Doimiy Fon Xizmati (Foreground Service)**: Ilova tezkor xotiradan o'chirib yuborilsa ham GPS monitoringi to'xtamaydi;
            - **Telefon yoqilganda avtomatik faollashish**: BootReceiver orqali telefon o'chib yonganda ham ishga tushadi;
            - **Xodim uchun 0 ta harakat**: Faqat bitta ruxsat beriladi, xodimdan kordinata kiritish talab qilinmaydi;
            - **Rahbar maxfiyligi**: Rahbar roli hech qachon kuzatilmaydi.
          files: static/downloads/xodim-reyting.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
