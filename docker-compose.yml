version: '3.8'

services:
  # =========================================================================
  # 1. Asosiy Backend va Telegram Bot Konteyneri
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xodim_reyting_app
    # O'z-o'zini tiklash (Self-healing & Auto-restart on crash)
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - PYTHONUNBUFFERED=1
    volumes:
      # Ma'lumotlar bazasi va loglar uchun xotira
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M

  # =========================================================================
  # 2. Xavfsiz PostgreSQL Bazasi (Hetzner / VPS uchun o'zida saqlash rejimi)
  # Izoh: Agar Supabase / Neon kabi bulutli baza ishlatilsa, ushbu servis shart emas
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: xodim_reyting_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-super_secure_postgres_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-xodim_reyting}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    ports:
      - "127.0.0.1:5432:5432" # Faqat localhost orqali xavfsiz ulanish
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  app_data:
  postgres_data:
