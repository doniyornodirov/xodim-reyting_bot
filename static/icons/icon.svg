<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Luxury Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Upward Surge Gradient (X Left-to-Right Ascending) -->
    <linearGradient id="surgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="45%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Crossing Dynamic Wing Gradient -->
    <linearGradient id="wingGrad" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="55%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="46%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="starGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#38bdf8" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffffff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glowing Inner and Outer Borders -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#borderGrad)" stroke-width="5.5" opacity="0.85"/>
  <rect x="15" y="15" width="482" height="482" rx="110" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

  <!-- Ambient Light Sphere -->
  <circle cx="256" cy="230" r="180" fill="url(#coreGlow)"/>

  <!-- Background KPI Analytics Histogram (Subtle Growth Columns) -->
  <g opacity="0.22">
    <rect x="108" y="290" width="34" height="95" rx="10" fill="#6366f1"/>
    <rect x="158" y="240" width="34" height="145" rx="10" fill="#6366f1"/>
    <rect x="320" y="190" width="34" height="195" rx="10" fill="#38bdf8"/>
    <rect x="370" y="140" width="34" height="245" rx="10" fill="#38bdf8"/>
  </g>

  <!-- Modern Dynamic Monogram 'X' + Soaring Growth -->
  <g filter="url(#glowShadow)">
    <!-- Descending Arm of 'X' (Back Layer) -->
    <path d="M 366 112 C 378 124 378 144 366 156 L 156 366 C 144 378 124 378 112 366 C 100 354 100 334 112 322 L 322 112 C 334 100 354 100 366 112 Z" 
          fill="url(#wingGrad)" 
          opacity="0.92"/>

    <!-- Ascending Growth Surge Arm of 'X' (Front Layer - Speed and KPI Momentum) -->
    <path d="M 112 112 C 124 100 144 100 156 112 L 366 322 C 378 334 378 354 366 366 C 354 378 334 378 322 366 L 112 156 C 100 144 100 124 112 112 Z" 
          fill="url(#surgeGrad)"/>
          
    <!-- Core Cross Diamond Junction Accent -->
    <rect x="232" y="215" width="48" height="48" rx="12" transform="rotate(45 256 239)" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Precision KPI Target Diamond / Achievement Star at Peak (Top-Right) -->
  <g filter="url(#starGlow)" transform="translate(382, 98)">
    <path d="M 0 -28 Q 0 -4 24 0 Q 0 4 0 28 Q 0 4 -24 0 Q 0 -4 0 -28 Z" fill="#ffffff"/>
    <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
  </g>

  <!-- Secondary Spark (Top-Left Micro Spark) -->
  <g filter="url(#starGlow)" transform="translate(122, 88)" opacity="0.8">
    <path d="M 0 -16 Q 0 -2 14 0 Q 0 2 0 16 Q 0 2 -14 0 Q 0 -2 0 -16 Z" fill="#a855f7"/>
  </g>

  <!-- Executive Bottom Branding Pill Tag -->
  <g transform="translate(256, 432)">
    <rect x="-82" y="-20" width="164" height="38" rx="13" fill="#0b101d" stroke="url(#borderGrad)" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="16" fill="#38bdf8" letter-spacing="3.5">XODIM<tspan fill="#818cf8">KPI</tspan></text>
  </g>
</svg>