<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- KPI Bars Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Lightning / Growth Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#facc15" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Subtle Glowing Border -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#ringGrad)" stroke-width="6" opacity="0.85"/>
  <rect x="14" y="14" width="484" height="484" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Center Artwork: Dynamic KPI Growth Bars + Lightning Energy -->
  <g filter="url(#glow)">
    <!-- KPI Analytics Chart Bars (Ascending Growth) -->
    <!-- Bar 1 (Left) -->
    <rect x="110" y="270" width="44" height="132" rx="14" fill="#3b82f6" opacity="0.85"/>
    <!-- Bar 2 (Middle-Left) -->
    <rect x="178" y="210" width="44" height="192" rx="14" fill="url(#barGrad)"/>
    <!-- Bar 3 (Middle-Right) -->
    <rect x="246" y="150" width="44" height="252" rx="14" fill="url(#barGrad)"/>
    <!-- Bar 4 (Right Peak) -->
    <rect x="314" y="100" width="44" height="302" rx="14" fill="#38bdf8"/>
  </g>

  <!-- Dynamic Lightning Bolt Cutting Diagonally (Speed & Energy) -->
  <g filter="url(#boltGlow)">
    <path d="M 305 60 L 195 240 L 275 240 L 215 452 L 395 205 L 295 205 Z" 
          fill="url(#boltGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linejoin="round"/>
  </g>

  <!-- KPI Badge Tag at Bottom -->
  <g transform="translate(256, 435)">
    <rect x="-68" y="-22" width="136" height="36" rx="12" fill="#0f172a" stroke="url(#ringGrad)" stroke-width="2.5"/>
    <text x="0" y="3" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#38bdf8" letter-spacing="3.5">KPI</text>
  </g>
</svg>